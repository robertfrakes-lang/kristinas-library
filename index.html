<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kristina's Library</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <style>
        :root {
            --bg-color: #F9F7F1; 
            --text-color: #3E2723; 
            --accent-color: #8D6E63; 
            --shelf-bg: #EFEBE0; 
            --card-bg: #FFFFFF;
            --tag-new: #D4A373;
            --ribbon-hc: #3E2723;
            --ribbon-pb: #6D594E;
            --ribbon-dg: #A88F80;
        }

        body { font-family: 'Merriweather', serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; overflow-x: hidden; }

        header { background-color: var(--text-color); color: var(--bg-color); text-align: center; padding: 30px 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); position: relative; }
        header h1 { font-family: 'Playfair Display', serif; font-size: 2.8em; margin: 0; letter-spacing: 1px; }
        header p { font-size: 1em; font-weight: 300; opacity: 0.8; margin-top: 8px; font-style: italic; }

        .top-controls { display: flex; justify-content: center; gap: 15px; margin-top: 15px; flex-wrap: wrap; }
        .control-btn { background: transparent; border: 1px solid var(--accent-color); color: var(--bg-color); padding: 8px 15px; font-family: 'Merriweather', serif; font-size: 0.9em; cursor: pointer; border-radius: 20px; transition: 0.3s; }
        .control-btn:hover { background: var(--accent-color); color: white; }

        .container { max-width: 1400px; margin: 0 auto; padding: 25px 20px; }

        .search-row { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .search-row select, .search-row input { padding: 12px 20px; font-family: 'Merriweather', serif; font-size: 1em; border: 1px solid var(--accent-color); border-radius: 25px; background: var(--card-bg); color: var(--text-color); outline: none; box-shadow: 0 4px 6px rgba(0,0,0,0.03); transition: 0.3s; }
        .search-row input { flex: 1; max-width: 500px; }
        .search-row input:focus, .search-row select:focus { box-shadow: 0 4px 12px rgba(141, 110, 99, 0.2); }
        .action-btn { background: var(--accent-color); color: white; border: none; padding: 12px 20px; font-family: 'Merriweather', serif; border-radius: 25px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .action-btn:hover { background: var(--text-color); transform: translateY(-2px); }

        .section-header { font-family: 'Playfair Display', serif; font-size: 2.2em; color: var(--text-color); border-bottom: 1px solid var(--accent-color); padding-bottom: 5px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: flex-end; }
        .section-subtitle { font-family: 'Merriweather', serif; font-size: 0.4em; opacity: 0.7; font-weight: normal; letter-spacing: 1px; text-transform: uppercase; }
        
        .shelf { display: flex; overflow-x: auto; gap: 20px; padding: 25px 15px; background: var(--shelf-bg); border-radius: 8px; box-shadow: inset 0 5px 15px rgba(0,0,0,0.04); scroll-behavior: smooth; margin-bottom: 40px; border-bottom: 6px solid #D7CCC8; }

        .book-card { flex: 0 0 160px; background: var(--card-bg); border-radius: 6px; padding: 12px; text-align: center; cursor: pointer; box-shadow: 0 6px 15px rgba(0,0,0,0.06); transition: 0.3s; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
        .book-card:hover { transform: translateY(-8px); box-shadow: 0 12px 20px rgba(0,0,0,0.12); }

        .cover-wrapper { width: 130px; height: 195px; margin: 0 auto 15px auto; position: relative; display: flex; justify-content: center; align-items: center; background-color: var(--accent-color); border-radius: 2px; }
        .shelf-cover-img { width: 100%; height: 100%; object-fit: cover; border-radius: 2px; box-shadow: 3px 3px 8px rgba(0,0,0,0.15); display: none; }
        .book-cover-placeholder { width: 100%; height: 100%; margin: 0; border-radius: 2px; box-shadow: 3px 3px 8px rgba(0,0,0,0.15); display: flex; align-items: center; justify-content: center; color: white; font-family: 'Playfair Display', serif; font-size: 0.9em; padding: 10px; box-sizing: border-box; background-image: linear-gradient(120deg, #8D6E63 0%, #6D4C41 100%); border-left: 4px solid #5D4037; }
        
        .book-title { font-family: 'Playfair Display', serif; font-size: 1.05em; font-weight: 700; line-height: 1.2; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .book-author { font-size: 0.8em; color: var(--accent-color); font-weight: 400; font-style: italic; }

        .tag-new { position: absolute; top: -8px; right: -8px; background: var(--tag-new); color: white; padding: 4px 8px; font-size: 0.7em; font-weight: bold; border-radius: 3px; z-index: 10; box-shadow: 2px 2px 5px rgba(0,0,0,0.2); font-family: sans-serif; letter-spacing: 1px; }
        .format-ribbon { position: absolute; top: 10px; left: -5px; padding: 3px 8px; font-size: 0.65em; font-family: sans-serif; font-weight: bold; color: white; z-index: 10; box-shadow: 1px 2px 4px rgba(0,0,0,0.2); border-radius: 0 3px 3px 0; text-transform: uppercase; }
        .ribbon-hc { background: var(--ribbon-hc); }
        .ribbon-pb { background: var(--ribbon-pb); }
        .ribbon-dg { background: var(--ribbon-dg); }

        #detailsModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(62, 39, 35, 0.85); z-index: 1000; backdrop-filter: blur(5px); justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .modal-content { background: var(--bg-color); max-width: 950px; width: 100%; border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); display: flex; overflow: hidden; position: relative; max-height: 90vh; }
        .modal-left { background: var(--shelf-bg); padding: 40px; display: flex; flex-direction: column; align-items: center; border-right: 1px solid rgba(0,0,0,0.05); width: 280px; flex-shrink: 0; }
        .modal-cover { width: 100%; max-width: 220px; border-radius: 4px; box-shadow: 5px 5px 15px rgba(0,0,0,0.2); margin-bottom: 20px; display: none; }
        .modal-right { padding: 40px; flex: 1; overflow-y: auto; }
        
        .modal-title { font-family: 'Playfair Display', serif; font-size: 2.2em; margin: 0 0 5px 0; line-height: 1.2; color: var(--text-color); }
        .modal-author { font-size: 1.2em; color: var(--accent-color); margin-bottom: 25px; font-style: italic; border-bottom: 1px solid rgba(0,0,0,0.1); padding-bottom: 15px; }
        
        .modal-meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; background: rgba(0,0,0,0.03); padding: 15px; border-radius: 6px; }
        .meta-label { font-weight: 700; color: var(--accent-color); text-transform: uppercase; font-size: 0.75em; letter-spacing: 1px; display: block; margin-bottom: 2px; }
        .meta-value { font-size: 0.95em; color: var(--text-color); }
        
        .modal-synopsis { line-height: 1.8; font-size: 1.05em; color: #555; margin-bottom: 30px; }
        .close-btn { position: absolute; top: 15px; right: 20px; background: none; border: none; font-size: 2.5em; cursor: pointer; color: var(--text-color); opacity: 0.5; transition: 0.3s; z-index: 10; }
        .close-btn:hover { opacity: 1; transform: scale(1.1); }

        .recs-container { margin-top: 30px; border-top: 2px solid var(--accent-color); padding-top: 20px; }
        .recs-header { font-family: 'Playfair Display', serif; font-size: 1.2em; color: var(--text-color); margin-bottom: 15px; }
        .recs-grid { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px; }
        .rec-card { width: 100px; flex-shrink: 0; cursor: pointer; text-align: center; transition: 0.2s; }
        .rec-card:hover { transform: translateY(-4px); }
        .rec-spine { width: 80px; height: 120px; margin: 0 auto 8px auto; background: var(--accent-color); color: white; display: flex; align-items: center; justify-content: center; padding: 5px; font-size: 0.6em; font-family: 'Playfair Display', serif; box-shadow: 2px 2px 5px rgba(0,0,0,0.2); border-left: 2px solid #5D4037; }
        .rec-title { font-size: 0.75em; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        #ledgerOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--text-color); z-index: 2000; overflow-y: auto; padding: 40px; color: var(--bg-color); box-sizing: border-box; }
        .ledger-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--accent-color); padding-bottom: 20px; margin-bottom: 30px; }
        .ledger-title { font-family: 'Playfair Display', serif; font-size: 2.5em; margin: 0; color: var(--bg-color); }
        .ledger-btn { background: var(--bg-color); color: var(--text-color); border: none; padding: 10px 20px; font-family: 'Merriweather', serif; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: rgba(255,255,255,0.05); padding: 25px; border-radius: 8px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .stat-num { font-family: 'Playfair Display', serif; font-size: 3em; color: var(--tag-new); margin: 10px 0; }
        .list-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 40px; }
        .list-section h3 { font-family: 'Playfair Display', serif; color: var(--accent-color); border-bottom: 1px dashed rgba(255,255,255,0.2); padding-bottom: 10px; }
        .list-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.95em; }
        .list-count { color: var(--tag-new); font-weight: bold; }
    </style>
</head>
<body>

<header>
    <h1>Kristina's Library</h1>
    <p>A Curated Modern Bookstore</p>
    <div class="top-controls">
        <button class="control-btn" onclick="openLedger()">Librarian's Ledger 📋</button>
        <button class="control-btn" onclick="syncLibrary()">Sync ☁️</button>
    </div>
</header>

<div class="container">
    <div class="search-row">
        <select id="sortDropdown" onchange="handleSearch()">
            <option value="default">SORT: DEFAULT (A-Z)</option>
            <option value="z-a">SORT: Z - A</option>
            <option value="year-desc">SORT: NEWEST YR</option>
            <option value="year-asc">SORT: OLDEST YR</option>
            <option value="added-desc">SORT: RECENTLY ADDED</option>
        </select>
        <input type="text" id="searchInput" placeholder="Search by title, author, publisher, or genre..." oninput="handleSearch()">
        <button class="action-btn" onclick="rollSurprise()">Surprise Me 🎲</button>
    </div>
    
    <div id="status" style="text-align: center; font-style: italic; opacity: 0.6; margin-bottom: 20px;">Dusting off the shelves and fetching books...</div>
    
    <div id="justArrivedContainer"></div>
    <div id="libraryContainer"></div>
</div>

<div id="detailsModal" onclick="if(event.target === this) closeModal()">
    <div class="modal-content">
        <button class="close-btn" onclick="closeModal()">×</button>
        <div class="modal-left">
            <img id="modalCover" class="modal-cover" src="" alt="Book Cover">
            <div id="modalCoverPlaceholder" class="book-cover-placeholder" style="width: 200px; height: 300px; font-size: 1.3em; display:flex;"></div>
        </div>
        <div class="modal-right">
            <h2 id="modalTitle" class="modal-title">Title</h2>
            <div id="modalAuthor" class="modal-author">Author</div>
            
            <div class="modal-meta-grid">
                <div><span class="meta-label">Original Publication</span><span class="meta-value" id="modalYear">---</span></div>
                <div><span class="meta-label">Publisher</span><span class="meta-value" id="modalPublisher">---</span></div>
                <div><span class="meta-label">Format / Platform</span><span class="meta-value" id="modalFormat">---</span></div>
                <div><span class="meta-label">Genre</span><span class="meta-value" id="modalGenre">---</span></div>
                <div><span class="meta-label">Date Added</span><span class="meta-value" id="modalDate">---</span></div>
                <div><span class="meta-label">Barcode / ISBN</span><span class="meta-value" id="modalISBN">---</span></div>
            </div>

            <div class="meta-label" style="margin-bottom: 8px;">Synopsis</div>
            <div id="modalSynopsis" class="modal-synopsis">Loading description...</div>
            
            <div id="recsContainer" class="recs-container"></div>
        </div>
    </div>
</div>

<div id="ledgerOverlay">
    <div class="ledger-header">
        <h1 class="ledger-title">Librarian's Ledger</h1>
        <button class="ledger-btn" onclick="document.getElementById('ledgerOverlay').style.display='none'">Close ✕</button>
    </div>
    <div class="stat-grid" id="ledgerStats"></div>
    <div class="list-grid">
        <div class="list-section">
            <h3>Top Authors in Collection</h3>
            <div id="ledgerAuthors"></div>
        </div>
        <div class="list-section">
            <h3>Top Genres</h3>
            <div id="ledgerGenres"></div>
        </div>
    </div>
</div>

<script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQZlhaN7nCAYlmY7DCqFqvcvxU37x-9kiI5OSlJJLy8mNboIEqx-4ULiO5zIfmlBX2OJQz0DPwmUS2u/pub?output=csv";
    
    let masterData = [];
    let searchTimeout;

    document.addEventListener('DOMContentLoaded', () => { syncLibrary(); });

    function syncLibrary() {
        document.getElementById('status').style.display = 'block';
        document.getElementById('status').innerText = "Syncing with the archive...";
        Papa.parse(CSV_URL + "&t=" + new Date().getTime(), {
            download: true, header: true, skipEmptyLines: true,
            complete: function(results) {
                masterData = results.data.filter(row => row.Title && row.Title.trim() !== "");
                document.getElementById('status').style.display = 'none';
                renderJustArrived(masterData);
                handleSearch();
            }
        });
    }

    function getFormatRibbon(formatStr) {
        if(!formatStr) return '';
        let f = String(formatStr).toLowerCase();
        if(f.includes('hard') || f.includes('hc')) return `<div class="format-ribbon ribbon-hc">Hardcover</div>`;
        if(f.includes('paper') || f.includes('pb')) return `<div class="format-ribbon ribbon-pb">Paperback</div>`;
        if(f.includes('kindle') || f.includes('ebook') || f.includes('digital') || f.includes('audio')) return `<div class="format-ribbon ribbon-dg">Digital/Audio</div>`;
        return '';
    }

    function getNewBadge(dateAdded) {
        if(!dateAdded) return '';
        const added = new Date(dateAdded);
        const now = new Date();
        const diffDays = Math.ceil(Math.abs(now - added) / (1000 * 60 * 60 * 24));
        if (diffDays <= 60) return `<div class="tag-new">NEW!</div>`;
        return '';
    }

    // THE FIX: Smart Cover Checker
    function checkCover(imgEl) {
        if (imgEl.naturalWidth <= 1) {
            // Open Library returned a blank pixel (no cover found). Hiding it.
            imgEl.style.display = 'none';
            imgEl.nextElementSibling.style.display = 'flex';
        } else {
            // Cover exists! Show it instantly.
            imgEl.style.display = 'block';
            imgEl.nextElementSibling.style.display = 'none';
        }
    }

    // THE FIX: Build Card using Instant OpenLibrary Check
    function buildCardHTML(book) {
        const safeData = encodeURIComponent(JSON.stringify(book));
        const ribbon = getFormatRibbon(book.Format || book.Platform);
        const newBadge = getNewBadge(book['Date Added']);
        const isbnRaw = String(book.Barcode || book.ISBN || "").replace(/[^0-9X]/gi, ''); 
        
        let imgTag = '';
        if (isbnRaw && isbnRaw.length >= 9) {
            // Load instantly from Open Library without API limits
            imgTag = `<img class="shelf-cover-img" src="https://covers.openlibrary.org/b/isbn/${isbnRaw}-M.jpg" 
                           onload="checkCover(this)" onerror="checkCover(this)" alt="Cover" />`;
        }
        
        return `
            <div class="book-card" onclick="openDetails('${safeData}')">
                ${newBadge}
                ${ribbon}
                <div class="cover-wrapper">
                    ${imgTag}
                    <div class="book-cover-placeholder" ${isbnRaw.length >= 9 ? 'style="display:none;"' : 'style="display:flex;"'}>${book.Title || "Untitled"}</div>
                </div>
                <div>
                    <div class="book-title">${book.Title || "Untitled"}</div>
                    <div class="book-author">${book.Author || "Unknown"}</div>
                </div>
            </div>
        `;
    }

    function renderJustArrived(data) {
        const container = document.getElementById('justArrivedContainer');
        const sorted = [...data].filter(b => b['Date Added']).sort((a,b) => new Date(b['Date Added']) - new Date(a['Date Added']));
        const topRecent = sorted.slice(0, 30);
        
        if (topRecent.length === 0) { container.innerHTML = ''; return; }

        let html = `
            <div class="section-header">JUST ARRIVED <span class="section-subtitle">Latest additions to the library</span></div>
            <div class="shelf">
        `;
        topRecent.forEach(book => html += buildCardHTML(book));
        html += `</div>`;
        container.innerHTML = html;
    }

    function handleSearch() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const sortMethod = document.getElementById('sortDropdown').value;
            
            let filtered = masterData.filter(book => {
                return (String(book.Title || "").toLowerCase().includes(term) ||
                        String(book.Author || "").toLowerCase().includes(term) ||
                        String(book.Publisher || "").toLowerCase().includes(term) ||
                        String(book.Genre || "").toLowerCase().includes(term));
            });

            document.getElementById('justArrivedContainer').style.display = (term === "" && sortMethod === "default") ? "block" : "none";

            if (sortMethod !== 'default') {
                filtered.sort((a, b) => {
                    if (sortMethod === 'z-a') return String(b.Title).localeCompare(String(a.Title));
                    if (sortMethod === 'year-desc') return parseInt(b['Publication Year']||b['Release Year']||0) - parseInt(a['Publication Year']||a['Release Year']||0);
                    if (sortMethod === 'year-asc') return parseInt(a['Publication Year']||a['Release Year']||9999) - parseInt(b['Publication Year']||b['Release Year']||9999);
                    if (sortMethod === 'added-desc') return new Date(b['Date Added']||0) - new Date(a['Date Added']||0);
                    return 0;
                });
                renderFlat(filtered);
            } else {
                renderAZ(filtered);
            }
        }, 300);
    }

    function renderAZ(dataToRender) {
        const container = document.getElementById('libraryContainer');
        container.innerHTML = '';
        if (dataToRender.length === 0) { container.innerHTML = '<div style="text-align:center; padding: 50px; opacity: 0.5;">No books found.</div>'; return; }

        const grouped = {};
        dataToRender.forEach(book => {
            let firstChar = String(book.Title || "U").trim().charAt(0).toUpperCase();
            if (!/[A-Z]/.test(firstChar)) firstChar = "#";
            if (!grouped[firstChar]) grouped[firstChar] = [];
            grouped[firstChar].push(book);
        });

        const sortedLetters = Object.keys(grouped).sort((a, b) => {
            if (a === "#") return -1; if (b === "#") return 1; return a.localeCompare(b);
        });

        sortedLetters.forEach(letter => {
            grouped[letter].sort((a, b) => String(a.Title).localeCompare(String(b.Title)));
            let shelfHTML = `<div class="section-header">${letter}</div><div class="shelf">`;
            grouped[letter].forEach(book => shelfHTML += buildCardHTML(book));
            shelfHTML += `</div>`;
            container.innerHTML += shelfHTML;
        });
    }

    function renderFlat(dataToRender) {
        const container = document.getElementById('libraryContainer');
        if (dataToRender.length === 0) { container.innerHTML = '<div style="text-align:center; padding: 50px; opacity: 0.5;">No books found.</div>'; return; }
        
        let shelfHTML = `<div class="section-header">LIBRARY RESULTS</div><div class="shelf" style="flex-wrap: wrap; justify-content: center;">`;
        dataToRender.forEach(book => shelfHTML += buildCardHTML(book));
        shelfHTML += `</div>`;
        container.innerHTML = shelfHTML;
    }

    function rollSurprise() {
        if(masterData.length === 0) return;
        const randomBook = masterData[Math.floor(Math.random() * masterData.length)];
        const safeData = encodeURIComponent(JSON.stringify(randomBook));
        openDetails(safeData);
    }

    async function openDetails(encodedBook) {
        const book = JSON.parse(decodeURIComponent(encodedBook));
        
        document.getElementById('modalTitle').innerText = book.Title || "Untitled";
        document.getElementById('modalAuthor').innerText = book.Author || "Unknown Author";
        document.getElementById('modalFormat').innerText = book.Format || book.Platform || "Physical Copy";
        document.getElementById('modalGenre').innerText = book.Genre || "Uncategorized";
        document.getElementById('modalDate').innerText = book['Date Added'] || "Unknown";
        
        const isbnRaw = book.Barcode || book.ISBN || "";
        document.getElementById('modalISBN').innerText = isbnRaw || "N/A";
        
        document.getElementById('modalYear').innerText = book['Release Year'] || book['Publication Year'] || "Searching...";
        document.getElementById('modalPublisher').innerText = book.Publisher || "Searching...";
        document.getElementById('modalSynopsis').innerText = "Consulting the archives...";
        
        document.getElementById('modalCover').style.display = 'none';
        document.getElementById('modalCover').src = '';
        const placeholder = document.getElementById('modalCoverPlaceholder');
        placeholder.style.display = 'flex';
        placeholder.innerText = book.Title || "Untitled";

        document.getElementById('detailsModal').style.display = 'flex';
        buildRecommendations(book);

        try {
            let apiData = null;
            let cleanIsbn = String(isbnRaw).replace(/[^0-9X]/gi, ''); 

            // Only attempt the fetch if we have a valid ISBN
            if (cleanIsbn && cleanIsbn.length >= 9) {
                const res1 = await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${cleanIsbn}`);
                if (res1.ok) apiData = await res1.json();
            }

            // Smart Fallback (If Barcode fails, search by Title + Author)
            if (!apiData || !apiData.items || apiData.items.length === 0) {
                const cleanTitle = encodeURIComponent(String(book.Title).split('(')[0].trim()); 
                const cleanAuthor = encodeURIComponent(String(book.Author).trim());
                
                let textQuery = `intitle:${cleanTitle}`;
                if (cleanAuthor) textQuery += `+inauthor:${cleanAuthor}`;
                
                const res2 = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${textQuery}`);
                if (res2.ok) apiData = await res2.json();
            }

            if (apiData && apiData.items && apiData.items.length > 0) {
                const volumeInfo = apiData.items[0].volumeInfo;
                
                if (volumeInfo.imageLinks && volumeInfo.imageLinks.thumbnail) {
                    let imgUrl = volumeInfo.imageLinks.thumbnail.replace('http:', 'https:').replace('&edge=curl', '');
                    document.getElementById('modalCover').src = imgUrl;
                    document.getElementById('modalCover').style.display = 'block';
                    placeholder.style.display = 'none';
                }
                
                if (volumeInfo.description) {
                    document.getElementById('modalSynopsis').innerHTML = volumeInfo.description;
                } else if (apiData.items[0].searchInfo && apiData.items[0].searchInfo.textSnippet) {
                    document.getElementById('modalSynopsis').innerHTML = apiData.items[0].searchInfo.textSnippet;
                } else {
                    document.getElementById('modalSynopsis').innerText = "No detailed synopsis found in the archive.";
                }
                
                if (volumeInfo.publishedDate && (!book['Publication Year'])) {
                    document.getElementById('modalYear').innerText = volumeInfo.publishedDate.substring(0, 4);
                }
                if (volumeInfo.publisher && (!book.Publisher)) {
                    document.getElementById('modalPublisher').innerText = volumeInfo.publisher;
                }
            } else {
                document.getElementById('modalSynopsis').innerText = "No additional details found online for this edition. (Note: If your IP is currently timed out by Google, this will temporarily stay blank).";
            }
        } catch (err) {
            console.error(err);
            document.getElementById('modalSynopsis').innerText = "Unable to connect to metadata database. Google API may have temporarily locked your IP address.";
        }
    }

    function buildRecommendations(currentBook) {
        const container = document.getElementById('recsContainer');
        container.innerHTML = '';
        
        let author = String(currentBook.Author || "").trim();
        let genre = String(currentBook.Genre || "").trim();
        
        let recs = masterData.filter(b => b.Title !== currentBook.Title && (
            (author && b.Author === author) || (genre && b.Genre === genre)
        ));
        
        recs = recs.sort(() => 0.5 - Math.random()).slice(0, 3);
        
        if (recs.length > 0) {
            let html = `<div class="recs-header">If You Liked This...</div><div class="recs-grid">`;
            recs.forEach(r => {
                const safeRec = encodeURIComponent(JSON.stringify(r));
                html += `
                    <div class="rec-card" onclick="openDetails('${safeRec}')">
                        <div class="rec-spine">${r.Title}</div>
                        <div class="rec-title">${r.Title}</div>
                    </div>
                `;
            });
            html += `</div>`;
            container.innerHTML = html;
        }
    }

    function closeModal() { document.getElementById('detailsModal').style.display = 'none'; }

    function openLedger() {
        if(masterData.length === 0) return;
        
        let hc = 0, pb = 0, dg = 0;
        let authorCounts = {};
        let genreCounts = {};

        masterData.forEach(b => {
            let f = String(b.Format || b.Platform).toLowerCase();
            if(f.includes('hard') || f.includes('hc')) hc++;
            else if(f.includes('paper') || f.includes('pb')) pb++;
            else if(f.includes('kindle') || f.includes('digital') || f.includes('audio')) dg++;

            if(b.Author && b.Author !== "Unknown") authorCounts[b.Author] = (authorCounts[b.Author] || 0) + 1;
            if(b.Genre) genreCounts[b.Genre] = (genreCounts[b.Genre] || 0) + 1;
        });

        document.getElementById('ledgerStats').innerHTML = `
            <div class="stat-card"><div class="meta-label">Total Books</div><div class="stat-num">${masterData.length}</div></div>
            <div class="stat-card"><div class="meta-label">Hardcovers</div><div class="stat-num">${hc}</div></div>
            <div class="stat-card"><div class="meta-label">Paperbacks</div><div class="stat-num">${pb}</div></div>
            <div class="stat-card"><div class="meta-label">Digital / Audio</div><div class="stat-num">${dg}</div></div>
        `;

        const sortedAuthors = Object.entries(authorCounts).sort((a,b) => b[1] - a[1]).slice(0, 10);
        document.getElementById('ledgerAuthors').innerHTML = sortedAuthors.map(([name, count]) => `<div class="list-row"><span>${name}</span><span class="list-count">${count}</span></div>`).join('');

        const sortedGenres = Object.entries(genreCounts).sort((a,b) => b[1] - a[1]).slice(0, 10);
        document.getElementById('ledgerGenres').innerHTML = sortedGenres.map(([name, count]) => `<div class="list-row"><span>${name}</span><span class="list-count">${count}</span></div>`).join('');

        document.getElementById('ledgerOverlay').style.display = 'block';
    }
</script>
